<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Private Alarm</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                sans-serif;

            background: #f2f2f7;
            color: #1c1c1e;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        h1 {
            margin: 20px 0 8px;
            font-size: 32px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #6e6e73;
            line-height: 1.5;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            margin-bottom: 10px;
            font-size: 17px;
            font-weight: 600;
        }

        .duration {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .duration-field {
            text-align: center;
        }

        .duration-field input {
            width: 100%;
            padding: 14px 8px;

            border: 1px solid #d1d1d6;
            border-radius: 12px;

            background: white;
            color: inherit;

            font-size: 22px;
            text-align: center;
        }

        .duration-field span {
            display: block;
            margin-top: 6px;

            color: #6e6e73;
            font-size: 13px;
        }

        .sound-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sound {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 12px 14px;

            border: 1px solid #d1d1d6;
            border-radius: 14px;

            background: white;

            cursor: pointer;
        }

        .sound.selected {
            border-color: #007aff;
            box-shadow: 0 0 0 1px #007aff;
        }

        .sound-info {
            flex: 1;
            min-width: 0;
        }

        .sound-name {
            overflow: hidden;

            font-size: 16px;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sound-file {
            margin-top: 3px;

            color: #8e8e93;
            font-size: 12px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .preview {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: 0;
            border-radius: 50%;

            background: #e5e5ea;
            color: #1c1c1e;

            font-size: 17px;

            cursor: pointer;
        }

        .preview:active {
            opacity: 0.6;
        }

        .radio {
            width: 20px;
            height: 20px;

            flex-shrink: 0;

            border: 2px solid #8e8e93;
            border-radius: 50%;
        }

        .sound.selected .radio {
            border: 6px solid #007aff;
        }

        .main-button {
            width: 100%;
            padding: 16px;

            border: 0;
            border-radius: 15px;

            background: #007aff;
            color: white;

            font-size: 18px;
            font-weight: 600;

            cursor: pointer;
        }

        .main-button:active {
            opacity: 0.7;
        }

        .main-button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #status {
            margin-top: 16px;
            padding: 14px;

            border-radius: 12px;

            background: #e5e5ea;

            color: #3a3a3c;
            line-height: 1.4;
        }

        audio {
            width: 100%;
            margin-top: 16px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #000;
                color: #f2f2f7;
            }

            .duration-field input,
            .sound {
                border-color: #38383a;
                background: #1c1c1e;
                color: #f2f2f7;
            }

            .preview {
                background: #38383a;
                color: #f2f2f7;
            }

            #status {
                background: #1c1c1e;
                color: #d1d1d6;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <h1>Private Alarm</h1>

        <p class="subtitle">
            Play an alarm privately through your connected headphones.
        </p>

        <section class="section">
            <div class="section-title">
                Silence duration
            </div>

            <div class="duration">

                <div class="duration-field">
                    <input
                        id="hours"
                        type="number"
                        min="0"
                        max="99"
                        value="0"
                        inputmode="numeric"
                    >
                    <span>Hours</span>
                </div>

                <div class="duration-field">
                    <input
                        id="minutes"
                        type="number"
                        min="0"
                        max="59"
                        value="5"
                        inputmode="numeric"
                    >
                    <span>Minutes</span>
                </div>

                <div class="duration-field">
                    <input
                        id="seconds"
                        type="number"
                        min="0"
                        max="59"
                        value="0"
                        inputmode="numeric"
                    >
                    <span>Seconds</span>
                </div>

            </div>
        </section>

        <section class="section">

            <div class="section-title">
                Alarm sound
            </div>

            <div id="sound-list" class="sound-list"></div>

        </section>

        <button id="start" class="main-button">
            Start Alarm
        </button>

        <div id="status">
            Ready.
        </div>

        <audio id="player" controls></audio>

    </main>

    <script>
        /*
         * Add or remove filenames here whenever you change
         * the contents of the sounds/ folder.
         */
        const soundFiles = [
            "alarm.mp3",
            "alarm_2.wav",
            "alarm_clock.mp3",
            "boosted_alarm.wav",
            "double_beep.mp3",
            "heavy_ringing.mp3",
            "reflection.mp3",
            "ringing.mp3",
            "ringtone.mp3",
            "timer_alarm.mp3",
        ];

        const hoursInput = document.getElementById("hours");
        const minutesInput = document.getElementById("minutes");
        const secondsInput = document.getElementById("seconds");

        const soundList = document.getElementById("sound-list");
        const startButton = document.getElementById("start");
        const status = document.getElementById("status");
        const player = document.getElementById("player");

        let selectedSound = null;
        let previewAudio = null;

        function displayName(filename) {
            // Remove extension.
            let name = filename.replace(/\.(mp3|wav)$/i, "");

            // Replace underscores with spaces.
            name = name.replace(/_/g, " ");

            // Capitalize the first letter of every word.
            name = name.replace(
                /\b\p{L}/gu,
                letter => letter.toUpperCase()
            );

            return name;
        }

        function createSoundElement(filename) {
            const container = document.createElement("div");
            container.className = "sound";

            const radio = document.createElement("div");
            radio.className = "radio";

            const info = document.createElement("div");
            info.className = "sound-info";

            const name = document.createElement("div");
            name.className = "sound-name";
            name.textContent = displayName(filename);

            const file = document.createElement("div");
            file.className = "sound-file";
            file.textContent = filename;

            info.appendChild(name);
            info.appendChild(file);

            const preview = document.createElement("button");
            preview.className = "preview";
            preview.type = "button";
            preview.textContent = "▶";
            preview.setAttribute(
                "aria-label",
                `Preview ${displayName(filename)}`
            );

            preview.addEventListener("click", event => {
                event.stopPropagation();

                if (previewAudio) {
                    previewAudio.pause();
                    previewAudio.currentTime = 0;
                }

                previewAudio = new Audio(
                    `sounds/${encodeURIComponent(filename)}`
                );

                preview.textContent = "❚❚";

                previewAudio.addEventListener("ended", () => {
                    preview.textContent = "▶";
                });

                previewAudio.play().catch(error => {
                    console.error(error);
                    preview.textContent = "▶";
                });
            });

            container.appendChild(radio);
            container.appendChild(info);
            container.appendChild(preview);

            container.addEventListener("click", () => {
                document
                    .querySelectorAll(".sound")
                    .forEach(element => {
                        element.classList.remove("selected");
                    });

                container.classList.add("selected");
                selectedSound = filename;
            });

            return container;
        }

        function loadSounds() {
            soundList.innerHTML = "";

            if (soundFiles.length === 0) {
                soundList.textContent =
                    "No sounds configured yet.";
                startButton.disabled = true;
                return;
            }

            soundFiles.forEach((filename, index) => {
                const element =
                    createSoundElement(filename);

                soundList.appendChild(element);

                if (index === 0) {
                    element.classList.add("selected");
                    selectedSound = filename;
                }
            });
        }

        function getDurationSeconds() {
            const hours =
                Math.max(0, Number(hoursInput.value) || 0);

            const minutes =
                Math.max(0, Number(minutesInput.value) || 0);

            const seconds =
                Math.max(0, Number(secondsInput.value) || 0);

            return (
                hours * 3600 +
                minutes * 60 +
                seconds
            );
        }

        function formatDuration(totalSeconds) {
            const hours =
                Math.floor(totalSeconds / 3600);

            const minutes =
                Math.floor((totalSeconds % 3600) / 60);

            const seconds =
                totalSeconds % 60;

            return [
                hours.toString().padStart(2, "0"),
                minutes.toString().padStart(2, "0"),
                seconds.toString().padStart(2, "0")
            ].join(":");
        }

        startButton.addEventListener("click", async () => {
            const duration = getDurationSeconds();

            if (duration <= 0) {
                status.textContent =
                    "Please enter a duration greater than zero.";
                return;
            }

            if (!selectedSound) {
                status.textContent =
                    "Please select an alarm sound.";
                return;
            }

            status.textContent =
                "Preparing alarm...";

            /*
             * IMPORTANT:
             *
             * For now this creates the same kind of
             * silence + sound sequence that our successful
             * prototype used.
             *
             * We will replace this with the final efficient
             * audio-generation implementation next.
             */

            try {
                const sound = new Audio(
                    `sounds/${encodeURIComponent(selectedSound)}`
                );

                /*
                 * We need the actual duration of the selected
                 * sound before building the final audio file.
                 */
                await new Promise((resolve, reject) => {
                    sound.addEventListener(
                        "loadedmetadata",
                        resolve,
                        { once: true }
                    );

                    sound.addEventListener(
                        "error",
                        reject,
                        { once: true }
                    );

                    sound.load();
                });

                /*
                 * Temporary implementation:
                 *
                 * We use Web Audio to combine silence and
                 * the selected sound.
                 *
                 * This is intentionally the next area we'll
                 * improve once we verify the UI and sound
                 * loading work correctly.
                 */

                const response =
                    await fetch(
                        `sounds/${encodeURIComponent(selectedSound)}`
                    );

                const arrayBuffer =
                    await response.arrayBuffer();

                const audioContext =
                    new AudioContext();

                const audioBuffer =
                    await audioContext.decodeAudioData(
                        arrayBuffer
                    );

                const sampleRate =
                    audioBuffer.sampleRate;

                const channels =
                    audioBuffer.numberOfChannels;

                const silenceSamples =
                    Math.floor(
                        duration * sampleRate
                    );

                const totalSamples =
                    silenceSamples +
                    audioBuffer.length;

                const output =
                    audioContext.createBuffer(
                        channels,
                        totalSamples,
                        sampleRate
                    );

                for (let channel = 0; channel < channels; channel++) {
                    const destination =
                        output.getChannelData(channel);

                    const source =
                        audioBuffer.getChannelData(
                            channel
                        );

                    /*
                     * The newly created buffer is already
                     * initialized to zero, so this section
                     * is the silence.
                     */

                    destination.set(
                        source,
                        silenceSamples
                    );
                }

                const wav =
                    audioBufferToWav(output);

                const url =
                    URL.createObjectURL(wav);

                player.src = url;

                await audioContext.close();

                await player.play();

                status.textContent =
                    `Alarm started. ` +
                    `Silence: ${formatDuration(duration)}. ` +
                    `Sound: ${displayName(selectedSound)}. ` +
                    `You can now lock the iPhone.`;

            } catch (error) {
                console.error(error);

                status.textContent =
                    "Unable to prepare the alarm. " +
                    "Check that the sound file exists and try again.";
            }
        });

        function audioBufferToWav(buffer) {
            const channels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;

            let length = buffer.length * channels * 2;
            const arrayBuffer =
                new ArrayBuffer(44 + length);

            const view =
                new DataView(arrayBuffer);

            writeString(view, 0, "RIFF");
            view.setUint32(
                4,
                36 + length,
                true
            );

            writeString(view, 8, "WAVE");
            writeString(view, 12, "fmt ");

            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(
                22,
                channels,
                true
            );

            view.setUint32(
                24,
                sampleRate,
                true
            );

            view.setUint32(
                28,
                sampleRate * channels * 2,
                true
            );

            view.setUint16(
                32,
                channels * 2,
                true
            );

            view.setUint16(
                34,
                16,
                true
            );

            writeString(view, 36, "data");

            view.setUint32(
                40,
                length,
                true
            );

            let offset = 44;

            for (let i = 0; i < buffer.length; i++) {
                for (let channel = 0; channel < channels; channel++) {
                    let sample =
                        buffer.getChannelData(channel)[i];

                    sample =
                        Math.max(
                            -1,
                            Math.min(1, sample)
                        );

                    view.setInt16(
                        offset,
                        sample < 0
                            ? sample * 0x8000
                            : sample * 0x7fff,
                        true
                    );

                    offset += 2;
                }
            }

            return new Blob(
                [arrayBuffer],
                { type: "audio/wav" }
            );
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(
                    offset + i,
                    string.charCodeAt(i)
                );
            }
        }

        player.addEventListener("ended", () => {
            status.textContent =
                "Alarm finished.";
        });

        loadSounds();
    </script>
</body>
</html>
