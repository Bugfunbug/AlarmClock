<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Private Alarm</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                sans-serif;

            background: #f2f2f7;
            color: #1c1c1e;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        h1 {
            margin: 20px 0 8px;
            font-size: 32px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #6e6e73;
            line-height: 1.5;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            margin-bottom: 10px;
            font-size: 17px;
            font-weight: 600;
        }

        .duration {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .duration-field {
            text-align: center;
        }

        .duration-field input {
            width: 100%;
            padding: 14px 8px;

            border: 1px solid #d1d1d6;
            border-radius: 12px;

            background: white;
            color: inherit;

            font-size: 22px;
            text-align: center;
        }

        .duration-field span {
            display: block;
            margin-top: 6px;

            color: #6e6e73;
            font-size: 13px;
        }

        .sound-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sound {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 12px 14px;

            border: 1px solid #d1d1d6;
            border-radius: 14px;

            background: white;
            cursor: pointer;
        }

        .sound.selected {
            border-color: #007aff;
            box-shadow: 0 0 0 1px #007aff;
        }

        .sound-info {
            flex: 1;
            min-width: 0;
        }

        .sound-name {
            overflow: hidden;

            font-size: 16px;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sound-file {
            margin-top: 3px;

            color: #8e8e93;
            font-size: 12px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .preview-controls {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .preview {
            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 50%;

            background: #e5e5ea;
            color: #1c1c1e;

            font-size: 16px;
            cursor: pointer;
        }

        .preview:active {
            opacity: 0.6;
        }

        .radio {
            width: 20px;
            height: 20px;

            flex-shrink: 0;

            border: 2px solid #8e8e93;
            border-radius: 50%;
        }

        .sound.selected .radio {
            border: 6px solid #007aff;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button.main-button {
            width: 100%;
            padding: 16px;

            border: 0;
            border-radius: 15px;

            color: white;

            font-size: 18px;
            font-weight: 600;

            cursor: pointer;
        }

        #start {
            background: #007aff;
        }

        #stop {
            background: #ff3b30;
        }

        button.main-button:active {
            opacity: 0.7;
        }

        button.main-button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #status {
            margin-top: 16px;
            padding: 14px;

            border-radius: 12px;

            background: #e5e5ea;

            color: #3a3a3c;
            line-height: 1.4;
        }

        #progress {
            display: none;
            margin-top: 16px;
        }

        #progress-bar {
            width: 100%;
            height: 8px;

            overflow: hidden;

            border-radius: 999px;
            background: #d1d1d6;
        }

        #progress-fill {
            width: 0;
            height: 100%;

            border-radius: inherit;
            background: #007aff;

            transition: width 0.25s linear;
        }

        #progress-text {
            margin-top: 8px;

            color: #6e6e73;

            font-size: 13px;
            text-align: center;
        }

        #player {
            display: none;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #000;
                color: #f2f2f7;
            }

            .duration-field input,
            .sound {
                border-color: #38383a;
                background: #1c1c1e;
                color: #f2f2f7;
            }

            .preview {
                background: #38383a;
                color: #f2f2f7;
            }

            #status {
                background: #1c1c1e;
                color: #d1d1d6;
            }

            #progress-bar {
                background: #38383a;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <h1>Private Alarm</h1>

    <p class="subtitle">
        Play an alarm privately through your connected headphones.
    </p>

    <section class="section">

        <div class="section-title">
            Silence duration
        </div>

        <div class="duration">

            <div class="duration-field">
                <input
                    id="hours"
                    type="number"
                    min="0"
                    max="99"
                    value="0"
                    inputmode="numeric"
                >
                <span>Hours</span>
            </div>

            <div class="duration-field">
                <input
                    id="minutes"
                    type="number"
                    min="0"
                    max="59"
                    value="5"
                    inputmode="numeric"
                >
                <span>Minutes</span>
            </div>

            <div class="duration-field">
                <input
                    id="seconds"
                    type="number"
                    min="0"
                    max="59"
                    value="0"
                    inputmode="numeric"
                >
                <span>Seconds</span>
            </div>

        </div>

    </section>

    <section class="section">

        <div class="section-title">
            Alarm sound
        </div>

        <div id="sound-list" class="sound-list"></div>

    </section>

    <section class="section">

        <div class="controls">

            <button
                id="start"
                class="main-button"
            >
                Start Alarm
            </button>

            <button
                id="stop"
                class="main-button"
                disabled
            >
                Stop
            </button>

        </div>

    </section>

    <div id="status">
        Ready.
    </div>

    <div id="progress">

        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>

        <div id="progress-text">
            00:00:00 / 00:00:00
        </div>

    </div>

    <audio id="player"></audio>

</main>

<script>

const soundFiles = [
    "alarm.mp3",
    "alarm_2.wav",
    "alarm_clock.mp3",
    "boosted_alarm.wav",
    "double_beep.mp3",
    "heavy_ringing.mp3",
    "reflection.mp3",
    "ringing.mp3",
    "ringtone.mp3",
    "timer_alarm.mp3",
];


const hoursInput =
    document.getElementById("hours");

const minutesInput =
    document.getElementById("minutes");

const secondsInput =
    document.getElementById("seconds");

const soundList =
    document.getElementById("sound-list");

const startButton =
    document.getElementById("start");

const stopButton =
    document.getElementById("stop");

const status =
    document.getElementById("status");

const player =
    document.getElementById("player");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progress-fill");

const progressText =
    document.getElementById("progress-text");


let selectedSound = null;

let previewAudio = null;

let alarmRunning = false;

let progressTimer = null;


/* -------------------------------------------------------
 * Utility
 * ----------------------------------------------------- */

function displayName(filename) {

    let name =
        filename.replace(
            /\.(mp3|wav)$/i,
            ""
        );

    name =
        name.replace(
            /[_-]+/g,
            " "
        );

    name =
        name.replace(
            /\b\p{L}/gu,
            letter =>
                letter.toUpperCase()
        );

    return name;
}


function soundURL(filename) {

    return (
        "sounds/" +
        encodeURIComponent(filename)
    );
}


function getDurationSeconds() {

    const hours =
        Math.max(
            0,
            Number(hoursInput.value) || 0
        );

    const minutes =
        Math.max(
            0,
            Number(minutesInput.value) || 0
        );

    const seconds =
        Math.max(
            0,
            Number(secondsInput.value) || 0
        );

    return (
        hours * 3600 +
        minutes * 60 +
        seconds
    );
}


function formatDuration(totalSeconds) {

    totalSeconds =
        Math.max(
            0,
            Math.floor(totalSeconds)
        );

    const hours =
        Math.floor(
            totalSeconds / 3600
        );

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;

    return [
        hours.toString().padStart(2, "0"),
        minutes.toString().padStart(2, "0"),
        seconds.toString().padStart(2, "0")
    ].join(":");
}


/* -------------------------------------------------------
 * Preview sounds
 * ----------------------------------------------------- */

function stopPreview() {

    if (!previewAudio) {
        return;
    }

    previewAudio.pause();

    previewAudio.currentTime = 0;

    if (previewAudio.playButton) {
        previewAudio.playButton.textContent = "▶";
    }

    previewAudio = null;
}


function createSoundElement(filename) {

    const container =
        document.createElement("div");

    container.className = "sound";


    const radio =
        document.createElement("div");

    radio.className = "radio";


    const info =
        document.createElement("div");

    info.className = "sound-info";


    const name =
        document.createElement("div");

    name.className = "sound-name";

    name.textContent =
        displayName(filename);


    const file =
        document.createElement("div");

    file.className = "sound-file";

    file.textContent =
        filename;


    info.appendChild(name);
    info.appendChild(file);


    const previewControls =
        document.createElement("div");

    previewControls.className =
        "preview-controls";


    const playButton =
        document.createElement("button");

    playButton.className =
        "preview";

    playButton.type = "button";

    playButton.textContent =
        "▶";

    playButton.setAttribute(
        "aria-label",
        `Play ${displayName(filename)}`
    );


    const stopButton =
        document.createElement("button");

    stopButton.className =
        "preview";

    stopButton.type = "button";

    stopButton.textContent =
        "■";

    stopButton.setAttribute(
        "aria-label",
        `Stop ${displayName(filename)}`
    );


    /*
     * PLAY
     *
     * Always starts this preview from
     * the beginning.
     */
    playButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            stopPreview();


            const audio =
                new Audio(
                    soundURL(filename)
                );


            audio.playButton =
                playButton;

            previewAudio =
                audio;


            audio.addEventListener(
                "ended",
                () => {

                    playButton.textContent =
                        "▶";

                    if (
                        previewAudio === audio
                    ) {
                        previewAudio = null;
                    }
                }
            );


            playButton.textContent =
                "❚❚";


            audio.play()
                .catch(error => {

                    console.error(error);

                    playButton.textContent =
                        "▶";

                    if (
                        previewAudio === audio
                    ) {
                        previewAudio = null;
                    }
                });
        }
    );


    /*
     * STOP
     *
     * Completely resets the preview.
     */
    stopButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            if (
                previewAudio &&
                previewAudio.playButton === playButton
            ) {
                stopPreview();
            }
        }
    );


    previewControls.appendChild(
        playButton
    );

    previewControls.appendChild(
        stopButton
    );


    /*
     * Selecting the sound.
     */
    container.addEventListener(
        "click",
        () => {

            document
                .querySelectorAll(".sound")
                .forEach(element => {

                    element.classList.remove(
                        "selected"
                    );
                });


            container.classList.add(
                "selected"
            );


            selectedSound =
                filename;
        }
    );


    container.appendChild(radio);
    container.appendChild(info);
    container.appendChild(previewControls);

    return container;
}


function loadSounds() {

    soundList.innerHTML = "";

    soundFiles.forEach(
        (filename, index) => {

            const element =
                createSoundElement(
                    filename
                );

            soundList.appendChild(
                element
            );


            if (index === 0) {

                element.classList.add(
                    "selected"
                );

                selectedSound =
                    filename;
            }
        }
    );
}


/* -------------------------------------------------------
 * Alarm controls
 * ----------------------------------------------------- */

function resetAlarmUI() {

    alarmRunning = false;

    startButton.disabled =
        false;

    stopButton.disabled =
        true;

    progress.style.display =
        "none";

    progressFill.style.width =
        "0%";

    clearInterval(
        progressTimer
    );
}


function stopAlarm() {

    if (!alarmRunning) {
        return;
    }


    player.pause();

    player.removeAttribute("src");

    player.load();


    alarmRunning = false;


    resetAlarmUI();


    status.textContent =
        "Alarm stopped.";
}


stopButton.addEventListener(
    "click",
    stopAlarm
);


/* -------------------------------------------------------
 * Experimental efficient generator
 *
 * We deliberately test the modern APIs rather
 * than allocating an hour-long PCM WAV.
 * ----------------------------------------------------- */

async function testModernAudioAPIs() {

    const results = [];


    /*
     * Safari 26:
     * WebCodecs AudioEncoder.
     */
    if (
        typeof AudioEncoder !==
        "undefined"
    ) {
        results.push(
            "AudioEncoder available"
        );
    } else {
        results.push(
            "AudioEncoder unavailable"
        );
    }


    /*
     * MediaSource.
     */
    if (
        typeof MediaSource !==
        "undefined"
    ) {
        results.push(
            "MediaSource available"
        );
    } else {
        results.push(
            "MediaSource unavailable"
        );
    }


    /*
     * AAC support.
     */
    if (
        typeof MediaRecorder !==
        "undefined"
    ) {

        const aac =
            MediaRecorder.isTypeSupported(
                "audio/mp4;codecs=mp4a.40.2"
            );

        results.push(
            aac
                ? "AAC MediaRecorder available"
                : "AAC MediaRecorder unavailable"
        );
    }


    console.log(
        "Modern audio capabilities:",
        results
    );

    return results;
}


/*
 * Start alarm.
 *
 * At this stage we perform the capability test
 * and then use the existing known-good audio
 * mechanism for short tests.
 *
 * The actual compressed offline muxer will be
 * plugged in once we know exactly which APIs
 * your iPhone exposes.
 */
startButton.addEventListener(
    "click",
    async () => {

        if (alarmRunning) {
            return;
        }


        if (!selectedSound) {

            status.textContent =
                "Please select an alarm sound.";

            return;
        }


        const duration =
            getDurationSeconds();


        if (duration <= 0) {

            status.textContent =
                "Please enter a duration greater than zero.";

            return;
        }


        stopPreview();


        alarmRunning = true;

        startButton.disabled =
            true;

        stopButton.disabled =
            false;


        status.textContent =
            "Checking audio capabilities...";


        try {

            const capabilities =
                await testModernAudioAPIs();


            console.log(
                capabilities
            );


            /*
             * For now, this verifies the selected
             * sound can be loaded.
             */
            const response =
                await fetch(
                    soundURL(
                        selectedSound
                    )
                );


            if (!response.ok) {

                throw new Error(
                    `Could not load ${selectedSound}`
                );
            }


            const blob =
                await response.blob();


            /*
             * We have not yet generated the final
             * compact alarm file.
             *
             * Tell the user exactly what's happening
             * rather than silently doing something
             * different.
             */
            status.textContent =
                "Modern audio APIs detected. " +
                "The compact alarm generator is being tested " +
                "with this sound: " +
                displayName(selectedSound);


            /*
             * Temporary test:
             *
             * Play the sound itself so we can verify
             * that the media element remains our
             * playback mechanism.
             */
            const url =
                URL.createObjectURL(
                    blob
                );


            player.src = url;

            player.currentTime = 0;


            await player.play();


            status.textContent =
                "Test playback running. " +
                "The long-silence encoder is not yet being " +
                "used for this test.";


            player.addEventListener(
                "ended",
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                    resetAlarmUI();

                    status.textContent =
                        "Alarm finished.";
                },
                { once: true }
            );


        } catch (error) {

            console.error(error);

            status.textContent =
                "Audio test failed: " +
                error.message;

            resetAlarmUI();
        }
    }
);


/* -------------------------------------------------------
 * Progress
 * ----------------------------------------------------- */

player.addEventListener(
    "timeupdate",
    () => {

        if (!player.duration) {
            return;
        }


        progress.style.display =
            "block";


        const percentage =
            (
                player.currentTime /
                player.duration
            ) * 100;


        progressFill.style.width =
            `${percentage}%`;


        progressText.textContent =
            `${formatDuration(player.currentTime)} / ` +
            `${formatDuration(player.duration)}`;
    }
);


loadSounds();

</script>

</body>
</html>
